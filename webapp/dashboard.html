<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SurviveTheMonth</title>
<link rel="icon" href="static/favicon.ico">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="dashboard">
    <nav class="topnav">
      <span class="brand">SurviveTheMonth</span>
      <span>
        <a href="settings.html">Settings</a>
        <a href="#" id="logout-link">Log Out</a>
      </span>
    </nav>
    <div id="flash" class="flash" style="display:none"></div>

    <section class="meter-card">
      <h2>Survival: <span id="survival-pct">--</span>%</h2>
      <p>Spent <span id="total-spent">--</span> of <span id="budget">--</span> this month</p>
    </section>

    <section class="add-expense-card">
      <h3>Log an Expense</h3>
      <form id="add-form" novalidate>
        <input type="text" name="description" placeholder="Description" required>
        <input type="number" name="amount" placeholder="Amount" min="0.01" step="0.01" required>
        <select name="category" id="category-select" required></select>
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>

    <section class="expense-list-card">
      <h3>This Month's Log</h3>
      <ul id="expense-list"></ul>
    </section>
  </main>

  <script src="static/config.js"></script>
  <script src="static/app.js"></script>
  <script>
    requireAuth();

    async function loadDashboard() {
      try {
        const data = await api('/api/expenses');
        document.getElementById('total-spent').textContent = money(data.total_spent);
        document.getElementById('budget').textContent = money(data.budget);
        document.getElementById('survival-pct').textContent = data.survival_pct;

        const select = document.getElementById('category-select');
        select.innerHTML = data.categories.map(c => `<option value="${c}">${c}</option>`).join('');

        const list = document.getElementById('expense-list');
        list.innerHTML = data.expenses.length
          ? data.expenses.map(e => `
              <li data-id="${e.id}">
                <span>${e.description} — ${money(e.amount)} <em>(${e.category})</em></span>
                <button class="btn-delete" data-id="${e.id}">Delete</button>
              </li>`).join('')
          : '<li>No expenses logged yet.</li>';

        list.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              await api(`/api/expenses/${btn.dataset.id}`, { method: 'DELETE' });
              loadDashboard();
            } catch (err) {
              showFlash(err.message);
            }
          });
        });
      } catch (err) {
        showFlash(err.message);
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      try {
        await api('/api/expenses', {
          method: 'POST',
          body: JSON.stringify({
            description: form.get('description'),
            amount: form.get('amount'),
            category: form.get('category'),
          }),
        });
        e.target.reset();
        loadDashboard();
      } catch (err) {
        showFlash(err.message);
      }
    });

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      clearToken();
      window.location.href = 'login.html';
    });

    loadDashboard();
  </script>
</body>
</html>
